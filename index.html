<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="manifest" href="manifest.webmanifest">

<body>
  <header class="topbar">
    <button class="back" id="back" hidden aria-label="Terug">‹ Terug</button>
    <h1 id="title">Weekmenu</h1>
    <a class="gear" href="#/instellingen" data-tab="instellingen" aria-label="Instellingen">

    </a>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Hoofdmenu">
    <a href="#/week" data-tab="week">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Week</a>

      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Terugblik</a>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="recipes.js"></script>
  <script src="app.js"></script>

</html>
